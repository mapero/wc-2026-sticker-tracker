name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Allow one concurrent run; don't cancel an in-progress main build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # build runs check:i18n + vue-tsc + vite build
      - run: npm run build

  # NOTE: GitHub Pages deploy was removed on 2026-11-14 — Pages was never
  # enabled for this repo, so configure-pages failed on every run since the
  # workflow's inception. Production deploys go through the Docker images
  # (docker-publish.yml -> ghcr.io -> Arcane). To re-enable Pages: set the
  # repo's Pages source to "GitHub Actions" in Settings, then restore the
  # configure-pages / upload-pages-artifact / deploy-pages steps from git
  # history (commit 3d173d5 or earlier).
